# ============================================================================
# CONFIGURAÇÃO SPRING BOOT & BANCO DE DADOS LOCAL (POSTGRESQL & H2)
# Ambiente de Desenvolvimento Local
# ============================================================================
spring.application.name=eventos-api
server.port=8080

# --- Conexão PostgreSQL Local ---
spring.datasource.url=jdbc:postgresql://localhost:5432/db_eventos
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configuração JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Inicialização de Scripts SQL (schema.sql e data.sql) ---
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=true

# --- H2 Console (Disponível para depuração local) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
