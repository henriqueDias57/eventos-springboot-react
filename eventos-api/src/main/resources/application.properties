# ============================================================================
# CONFIGURAÇÃO SPRING BOOT & BANCO DE DADOS (POSTGRESQL & H2)
# Suporte a Variáveis de Ambiente para Deploy em Produção
# ============================================================================
spring.application.name=eventos-api
server.port=${PORT:8080}

# --- Conexão PostgreSQL (Parametrizada por Variáveis de Ambiente) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_eventos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configuração JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Inicialização de Scripts SQL (schema.sql e data.sql) ---
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=true

# --- Segurança de Acesso à Infraestrutura (Chave Mestra / Basic Auth) ---
app.security.enabled=${SECURITY_ENABLED:true}
app.security.username=${SECURITY_ADMIN_USERNAME:admin}
app.security.password=${SECURITY_ADMIN_PASSWORD:Eventos2026!Master#Secure}

# --- H2 Console (Disponível para depuração e testes) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
