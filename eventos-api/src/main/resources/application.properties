# ============================================================================
# CONFIGURAÇÃO SPRING BOOT & BANCO DE DADOS (PRODUÇÃO / LOCAL)
# Lê PORT, DB_URL, DB_USER e DB_PASSWORD de variáveis de ambiente
# com fallback automático para desenvolvimento local.
# ============================================================================
spring.application.name=eventos-api
server.port=${PORT:8080}

# --- Conexão PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_eventos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configuração JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Inicialização Idempotente de Scripts SQL (schema.sql e data.sql) ---
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=true

# --- H2 Console (Disponível para depuração local) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
